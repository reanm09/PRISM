[package]
name = "prism-sentinel"
version = "0.7.3"
description = "PRISM Sentinel endpoint protection client"
authors = ["PRISM"]
edition = "2021"

[lib]
name = "prism_sentinel_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = "2.7.0"

[dependencies]
tauri = { version = "2.12.0", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
notify = "8.2"
rfd = "0.16"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "multipart"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
once_cell = "1.20"
